language: node_js

node_js:
  - "18"
  - "16"
  - "14"

cache:
  directories:
    - node_modules

install:
  - npm ci

script:
  - npm test
  - npm run lint

after_success:
  - npm run coverage

notifications:
  email: false

branches:
  only:
    - main
    - master
    - /^v\d+\.\d+\.\d+$/

jobs:
  include:
    - stage: security audit
      script: npm audit --audit-level moderate
    - stage: publish
      if: tag IS present
      script: skip
      deploy:
        provider: npm
        email: "$NPM_EMAIL"
        api_key: "$NPM_TOKEN"
        skip_cleanup: true
        on:
          tags: true
          node: "18"